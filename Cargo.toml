[package]
name = "global-dev-radar"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Global Dev Radar - scan businesses worldwide for software development opportunities"
license = "MIT"
repository = "https://github.com/hisayya/global-lead-gen-agent"
readme = "README.md"
keywords = ["lead-generation", "sales", "automation", "outreach", "b2b"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-openai = { version = "0.41", features = ["chat-completion", "rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
scraper = "0.23"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
lettre = { version = "0.11", features = ["builder", "smtp-transport", "tokio1-rustls-tls"], default-features = false }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
tokio-cron-scheduler = "0.14"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
futures = "0.3"
mailparse = "0.15"
rand = "0.9"
async-trait = "0.1.91"
urlencoding = "2.1.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_must_use = "deny"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unexpected_cfgs = "deny"
dead_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "warn"
await_holding_lock = "deny"
large_futures = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
future_not_send = "allow"
