[package]
name = "global-dev-radar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
async-openai = { version = "0.41", features = ["chat-completion", "rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
scraper = "0.23"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
lettre = { version = "0.11", features = ["builder", "smtp-transport", "tokio1-rustls-tls"], default-features = false }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
tokio-cron-scheduler = "0.14"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
futures = "0.3"
mailparse = "0.15"
rand = "0.9"
async-trait = "0.1.91"
urlencoding = "2.1.3"
